<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b0d" />
    <meta
      name="description"
      content="EDUKA reúne juegos de memoria para aprender distintos temas."
    />
    <title>EDUKA — Juegos de memoria</title>
    <link rel="icon" type="image/png" href="IMAGENES/isotipo-eduka-1000.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="buscador.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#coleccion">Saltar a la colección</a>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand-small" href="#inicio" aria-label="EDUKA, inicio">
          <img src="IMAGENES/isotipo-eduka-1000.png" alt="" />
          <span>EDUKA</span>
        </a>
        <a class="topbar-link" href="#coleccion">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 6.5c2.8-1.4 5.5-.9 8 1.2v11c-2.5-2.1-5.2-2.6-8-1.2v-11Zm16 0c-2.8-1.4-5.5-.9-8 1.2v11c2.5-2.1 5.2-2.6 8-1.2v-11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
          <span>Ver juegos</span>
        </a>
      </header>

      <main>
      <section class="hero" id="inicio" aria-labelledby="hero-title">
        <img class="hero-mark" src="IMAGENES/isotipo-eduka-1000.png" alt="" />
        <h1 id="hero-title">EDU<span>KA</span></h1>
        <p class="hero-byline">By Adael Jacho</p>
        <aside class="trivia-card" aria-labelledby="trivia-topic" aria-live="polite">
          <span class="trivia-topic" id="trivia-topic"></span>
          <p class="trivia-text" id="trivia-text"></p>
          <a class="trivia-source" id="trivia-source" target="_blank" rel="noopener noreferrer">
            Fuente
          </a>
        </aside>
      </section>

      <section class="collection" id="coleccion" aria-labelledby="collection-title">
        <div class="section-heading">
          <div>
            <h2 id="collection-title">Buscador</h2>
          </div>
          <p>Encuentra un juego por su nombre o categoría.</p>
        </div>

        <div
          class="category-filters"
          id="category-filters"
          role="group"
          aria-label="Filtrar juegos por categoría"
        ></div>

        <div class="search-panel" id="buscador">
          <label class="search-control" for="game-search">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8" />
              <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <input
              id="game-search"
              type="search"
              name="q"
              placeholder="Buscar por nombre o categoría…"
              autocomplete="off"
              aria-label="Buscar juegos por nombre o categoría"
              aria-describedby="search-hint"
            />
          </label>
          <button class="clear-button" id="clear-search" type="button" disabled>Limpiar</button>
        </div>

        <div class="results-line">
          <span class="results-count" id="results-count" role="status" aria-live="polite"></span>
        </div>

        <div class="game-grid" id="game-grid" role="list" aria-label="Juegos disponibles"></div>
        <div class="empty-state" id="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">⌕</div>
          <h3>No encontramos juegos</h3>
          <p>Prueba con otro nombre o categoría.</p>
        </div>
      </section>
      </main>

      <footer class="site-footer">
        <span class="footer-brand">EDUKA</span>
        <span>Una colección personal de juegos de memoria.</span>
      </footer>
    </div>
  </body>
</html>
